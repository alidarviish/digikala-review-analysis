[project]
name = "digikala-reviews"
version = "0.1.0"
description = "Recommendation and rating-band classification of Persian Digikala product reviews"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "matplotlib",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["jupyterlab", "ipykernel", "pytest", "ruff"]
# FaBERT on your own machine (offline prediction): the CPU build of torch, and the versions the
# models were trained with on the GPU. Install with: uv sync --group transformer
transformer = ["torch==2.14.1", "transformers==5.21.0", "tokenizers==0.23.3"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digikala_reviews"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]  # a marimo cell shows its last expression
