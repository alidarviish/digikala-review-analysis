[project]
name = "digikala-reviews"
version = "0.1.0"
description = "Recommendation and rating-band classification of Persian Digikala product reviews"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "matplotlib",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["jupyterlab", "ipykernel", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digikala_reviews"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]  # a marimo cell shows its last expression
